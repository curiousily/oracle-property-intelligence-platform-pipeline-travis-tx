name: ingest

on:
  schedule:
    # The city republishes the whole permits dataset daily at about 14:40–15:05 UTC.
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: Austin permits only. Re-read business dates on or after this day (YYYY-MM-DD). Empty uses the watermark.
        required: false

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

env:
  RAW_BUCKET: travis-oracle-raw
  DATA_DIR: ${{ github.workspace }}/data

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        source: [austin-permits, tcad-appraisal-export]
    env:
      SOURCE: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/r2-credentials
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Restore the source's watermark
        run: |
          state="state/${SOURCE}.json"
          mkdir -p "$DATA_DIR/state"
          if aws s3 ls "s3://$RAW_BUCKET/$state" --endpoint-url "$R2_ENDPOINT" > /dev/null; then
            aws s3 cp "s3://$RAW_BUCKET/$state" "$DATA_DIR/$state" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          fi

      - name: Ingest
        env:
          SINCE: ${{ inputs.since }}
        run: |
          run_id="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "RUN_ID=${run_id}" >> "$GITHUB_ENV"
          mkdir -p "$DATA_DIR/runs/${run_id}"
          npm run ingest -w @travis-oracle/pipeline --silent -- "$SOURCE" \
            --data-dir "$DATA_DIR" --run-id "${run_id}" ${SINCE:+--since "$SINCE"} \
            | tee "$DATA_DIR/runs/${run_id}/${SOURCE}.json"

      - name: Upload raw files and tables, then the run result, then the watermark
        run: |
          for dir in raw tables runs; do
            if [ -d "$DATA_DIR/$dir" ]; then
              aws s3 sync "$DATA_DIR/$dir" "s3://$RAW_BUCKET/$dir" --endpoint-url "$R2_ENDPOINT" --only-show-errors
            fi
          done
          state="state/${SOURCE}.json"
          if [ -f "$DATA_DIR/$state" ]; then
            aws s3 cp "$DATA_DIR/$state" "s3://$RAW_BUCKET/$state" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          fi

      - name: Summarize the run
        run: |
          {
            echo "### ${SOURCE} \`${RUN_ID}\`"
            echo
            echo '```json'
            cat "$DATA_DIR/runs/${RUN_ID}/${SOURCE}.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
